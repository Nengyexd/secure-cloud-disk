# 吉亦云盘系统 - 本地 Nginx 配置
# 文件位置：将此文件放到 Z:\nginx\conf\cloud-disk.conf
# 并在 nginx.conf 的 http 块中添加：include cloud-disk.conf;

server {
    listen 80;
    server_name localhost;

    # 设置字符集
    charset utf-8;

    # 前端静态文件
    location / {
        # 注意：使用正斜杠，Nginx 在 Windows 下也支持
        root Z:/大学Study/AAA毕业设计/基于AES加密的安全云盘系统/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;

        # 静态资源缓存（开发时可以关闭）
        # expires 7d;
        # add_header Cache-Control "public";
    }

    # 后端 API 代理
    location /api/ {
        proxy_pass http://localhost:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 支持（如果需要）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 文件上传大小限制 (2GB)
        client_max_body_size 2048M;

        # 超时设置（10分钟）
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        # 禁用缓冲，适合大文件传输
        proxy_buffering off;
    }

    # MinIO 对象存储代理（用于文件下载）
    # 注意：这个配置可选，如果后端直接返回文件，可以不需要
    location /minio/ {
        proxy_pass http://localhost:9000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 支持大文件
        client_max_body_size 2048M;

        # 超时设置
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        # 禁用缓冲
        proxy_buffering off;
    }

    # Gzip 压缩配置
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml font/truetype font/opentype
               application/vnd.ms-fontobject image/svg+xml;

    # 访问日志
    access_log logs/cloud-disk_access.log;
    error_log logs/cloud-disk_error.log;

    # 错误页面
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root html;
    }
}
